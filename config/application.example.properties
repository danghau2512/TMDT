# Copy thành config/application.local.properties (đã ignore) hoặc file ngoài repository.
# APP_CONFIG_FILE = đường dẫn tuyệt đối tới file cục bộ, không đóng gói vào WAR.
# Biến môi trường ưu tiên hơn khóa file; không đặt credential trong JDBC URL.
# db.url: sửa host 127.0.0.1 và port 3306 theo MySQL của bạn; schema dự án là c2c_demo.
db.url=jdbc:mysql://127.0.0.1:3306/c2c_demo?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
# Điền user MySQL thực tế; c2c_app chỉ là tên mẫu, không được tự tạo bởi ứng dụng.
db.username=c2c_app
# Thay giá trị mẫu bằng mật khẩu MySQL, không phải mật khẩu tài khoản demo trên website.
db.password=CHANGE_ME_LOCALLY
# File properties: mật khẩu có dấu backslash cần viết hai backslash để giữ nguyên.
db.pool.maximumSize=5
db.pool.connectionTimeoutMs=5000
# Chỉ bật trên máy phát triển; /health/db chỉ chấp nhận request loopback.
app.diagnostics.enabled=false
# Tùy chọn: thư mục ảnh tuyệt đối ngoài WAR, account chạy Tomcat có quyền đọc/ghi.
# Ưu tiên biến môi trường UPLOAD_ROOT. Dùng / trong đường dẫn Windows.
# Mặc định: user.home/.c2c-demo/uploads; cần sao lưu cùng database.
# upload.root=C:/c2c-data/uploads

# VNPAY Sandbox only. Enable in the ignored local backend file, never in browser code.
vnpay.enabled=false
vnpay.tmnCode=CHANGE_ME
vnpay.hashSecret=CHANGE_ME_LOCALLY
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.queryUrl=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
# Set host, port and actual context. Public IPN must be registered with VNPAY.
vnpay.returnUrl=http://localhost:8080/demo_war_exploded/payments/vnpay/return
vnpay.ipnUrl=http://localhost:8080/demo_war_exploded/payments/vnpay/ipn
vnpay.expiryMinutes=15
# Windows: true để client VNPAY dùng kho CA Windows của tài khoản chạy Tomcat.
# OS khác giữ false và dùng truststore JDK hợp lệ. Không tắt kiểm tra HTTPS.
vnpay.tls.useWindowsRoot=false
## Xác minh người bán bằng QR cục bộ; không cần API key hoặc dịch vụ OCR.
# Tuyệt đối, ngoài WAR và riêng biệt với upload.root; bỏ trống dùng thư mục seller-documents cạnh upload.root.
verification.root=
